[tool.ruff]
line-length = 100
exclude = [
    ".git",
    ".gemini",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "scratch",
    "build",
    "dist",
    "*.ipynb",
]

[tool.ruff.lint]
# E402: module-level import not at top — needed by scripts that set sys.path before importing
# BLE001: blind exception (legitimate in fallback chains)
# LOG015: root logger (acceptable in scripts)
# S110: try-except-pass (used in intentional no-op handlers)
# UP035: deprecated typing imports (kept for py3.9 compat)
# NOTE: F401 (unused imports) and F841 (unused variables) are intentionally NOT suppressed
# here — they were masking dead code. Suppress them per-line where genuinely needed.
ignore = ["E402", "BLE001", "LOG015", "S110", "UP035"]

