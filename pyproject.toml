[tool.ruff]
line-length = 100
exclude = [
    ".git",
    ".gemini",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "scratch",
    "build",
    "dist",
    "*.ipynb",
]

[tool.ruff.lint]
ignore = ["E402", "BLE001", "LOG015", "S110", "UP035", "F401", "F841"]
