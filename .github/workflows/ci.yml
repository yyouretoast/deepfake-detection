name: Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run PyTest Integration Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax Across Modules
        run: |
          python -m py_compile app.py
          python -m py_compile src/dataset/loader.py
          python -m py_compile src/dataset/preprocess.py
          python -m py_compile src/models/hybrid_detector.py
          python -m py_compile src/models/onnx_exporter.py
          python -m py_compile src/explainability/gradcam.py

      - name: Run Automated Test Suite (pytest)
        run: |
          pytest tests/ -v --tb=short
