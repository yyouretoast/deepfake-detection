name: Sync to Hugging Face Space

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Hugging Face Hub CLI
        run: pip install huggingface_hub

      - name: Deploy to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          hf upload yyouretoast/deepfake-detector . . --repo-type=space --token="$HF_TOKEN" \
            --exclude "manuscript/*" \
            --exclude "splits/*" \
            --exclude "scripts/*" \
            --exclude "tests/*" \
            --exclude "notebooks/*" \
            --exclude "figures/*" \
            --exclude "models/*" \
            --exclude "results/*" \
            --exclude "deepfake_crops_512/*" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.pth" \
            --exclude "*.onnx" \
            --exclude "pyproject.toml" \
            --exclude "predict.py" \
            --exclude "MODEL_CARD.md"

