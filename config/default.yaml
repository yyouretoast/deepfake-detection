# Deepfake Detection Configuration

paths:
  kaggle_input: "/kaggle/input/datasets/xdxd003/ff-c23/FaceForensics++_C23"
  output_dir: "/kaggle/working/frames"
  processed_dir: "/kaggle/working/processed"
  model_save_path: "/kaggle/working/deepfake_convnext_v2.pth"
  weights_url: "https://huggingface.co/spaces/yyouretoast/deepfake-detector/resolve/main/deepfake_convnext_v2.pth"

preprocessing:
  img_size: 224
  padding_scale: 1.30  # Relative bounding box expansion factor (1.30 = 30% expansion)
  max_videos_per_type: 150
  frames_per_video: 15
  min_face_size: 20

model:
  backbone: "convnext_base"
  pretrained: true
  use_fft_branch: true  # Toggle for Frequency Stream Ablation Study
  use_gated_fusion: true  # Adaptive Gated Fusion between spatial and frequency features
  spatial_embed_dim: 1024
  freq_embed_dim: 128
  freq_scale: 0.1  # Residual scaling factor for FFT stream (prevents random init noise)
  dropout: 0.3

training:
  batch_size: 64  # Distributed across 2x NVIDIA T4 GPUs (32 per GPU)
  num_workers: 4
  epochs_phase1: 3  # Frozen backbone warmup
  epochs_phase2: 15  # End-to-end differential LR fine-tuning
  lr_phase1: 1.0e-3
  lr_backbone: 1.0e-5  # Phase 2 backbone learning rate
  lr_head: 1.0e-4  # Phase 2 classifier head learning rate
  weight_decay: 1.0e-2
  use_amp: true  # PyTorch Automatic Mixed Precision (fp16)
  seed: 42

labels:
  real: 1  # Real faces mapped to label 1
  fake: 0  # Fake faces mapped to label 0

manipulation_types:
  all: ["Deepfakes", "Face2Face", "FaceSwap", "NeuralTextures", "FaceShifter"]
  held_out_loto: "FaceShifter"  # Target type for Leave-One-Type-Out generalization test

app:
  frames_to_sample: 10
  classification_threshold: 0.5
