# Deepfake Detection Configuration

paths:
  output_dir: "/kaggle/working/frames"
  processed_dir: "/kaggle/working/processed"
  model_save_path: "/kaggle/working/dual_stream_best.pth"
  weights_url: "https://huggingface.co/spaces/yyouretoast/deepfake-detector/resolve/main/dual_stream_calibrated.pth"

preprocessing:
  img_size: 512
  padding_scale: 1.50  # Relative bounding box expansion factor (1.50 = 50% expansion)
  max_videos_per_type: 1000
  max_real_videos: 1000
  max_fake_per_dir: 1000
  frames_per_video: 25
  min_face_size: 20

model:
  backbone: "convnext_small"
  pretrained: true
  use_fft_branch: true  # Toggle for Frequency Stream Ablation Study
  freq_embed_dim: 512
  dropout: 0.3

training:
  batch_size: 16  # Effective batch size 32 via 2 gradient accumulation steps
  gradient_accumulation_steps: 2
  num_workers: 4
  epochs: 15  # End-to-end differential LR fine-tuning
  lr_backbone: 1.0e-5  # Backbone learning rate
  lr_head: 1.0e-4  # Classifier head learning rate
  weight_decay: 1.0e-2
  use_amp: true  # PyTorch Automatic Mixed Precision (fp16)
  warmup_ratio: 0.1
  patience: 4
  seq_len: 16
  pos_weight: 1.0
  seed: 42

labels:
  real: 0  # Real faces mapped to label 0
  fake: 1  # Fake faces mapped to label 1

manipulation_types:
  all: ["Deepfakes", "Face2Face", "FaceSwap", "NeuralTextures", "Celeb-DF"]

app:
  frames_to_sample: 16
  classification_threshold: 0.5
